name: HA Build & Push to Gitea

on:
  push:
    branches:
      - master
      - main
      - "feat/ha-*"
      - "feat/phase*"
      - "copilot/*"
  # pull_request intentionally removed: this workflow runs on self-hosted k3s
  # runners. Allowing pull_request events from a public repo would let any
  # internet user execute arbitrary code inside the cluster network.
  # CI build feedback on PRs is provided by ci-tests.yml (GitHub-hosted runners).

# Cancel in-progress runs when a new push arrives on the same branch.
concurrency:
  group: ha-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: [self-hosted, k3s, linux, amd64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Gitea container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: git.nicholstech.org
          # act_runner 0.6.1 renders github.actor as "%!t(string=admin)"
          # when it is passed directly to an action input. Gitea's per-run
          # token is issued for the repository owner, so use that stable
          # identity until the runner expression bug is upgraded away.
          username: admin
          # Gitea's per-run token is repository-scoped but does not carry the
          # package scope required by the container registry.
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          REPO="git.nicholstech.org/nichols-homelab/jellyfin-ha-pgsql"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"  >> "$GITHUB_OUTPUT"

      - name: Install .NET SDK
        # Build on the runner host filesystem (native I/O) to avoid DinD
        # overlay-on-overlay throttling which makes dotnet publish ~20x slower.
        run: |
          DOTNET_INSTALL_DIR="$HOME/.dotnet"
          mkdir -p "$DOTNET_INSTALL_DIR"
          # global.json pins the server build to .NET 9. Installing only the
          # .NET 10 SDK leaves dotnet unable to resolve that pinned SDK.
          if ! "$DOTNET_INSTALL_DIR/dotnet" --list-sdks 2>/dev/null | grep -q "^9\\."; then
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-all-errors https://dot.net/v1/dotnet-install.sh |
                bash /dev/stdin --channel 9.0 --install-dir "$DOTNET_INSTALL_DIR"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          fi
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"
          echo "PATH=$DOTNET_INSTALL_DIR:$PATH" >> "$GITHUB_ENV"

      - name: Restore NuGet packages
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          dotnet restore Jellyfin.Server/Jellyfin.Server.csproj --runtime linux-x64

      - name: Publish Jellyfin server
        run: |
          export PATH="$HOME/.dotnet:$PATH"
          # The source is pinned to net9.0 while the runtime image currently
          # carries ASP.NET 10. Match the known-good production artifact by
          # publishing the .NET 9 runtime with the server.
          dotnet publish Jellyfin.Server/Jellyfin.Server.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            -p:TreatWarningsAsErrors=false \
            --output ./publish-output

      - name: Connect to the nested Docker daemon
        run: |
          # act_runner creates this job inside the runner's sibling DinD
          # daemon. The daemon is listening on the job bridge gateway, not on
          # this container's /var/run/docker.sock.
          # The minimal runner image does not include iproute2. Linux exposes
          # the default gateway in little-endian hex through /proc/net/route.
          gateway_hex="$(awk '$2 == "00000000" { print $3; exit }' /proc/net/route)"
          test "${#gateway_hex}" -eq 8
          printf -v docker_gateway '%d.%d.%d.%d' \
            "0x${gateway_hex:6:2}" "0x${gateway_hex:4:2}" \
            "0x${gateway_hex:2:2}" "0x${gateway_hex:0:2}"
          test -n "${docker_gateway}"
          docker_host="tcp://${docker_gateway}:2375"
          DOCKER_HOST="${docker_host}" docker version >/dev/null
          echo "DOCKER_HOST=${docker_host}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          # Only push the image on direct branch pushes, not on pull_request events.
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_repo }}:latest
